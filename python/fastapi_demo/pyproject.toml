[project]
name = "fastapi-demo"
version = "0.1.0"
description = "Contract Recognition FastAPI Service"
requires-python = ">=3.9"
dependencies = [
    "fastapi[standard]>=0.113.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
